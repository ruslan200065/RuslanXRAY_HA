name: Python checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q xray_gateway/app tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  container:
    name: Container (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build app image
        run: docker build --tag ruslan-xray-test xray_gateway
      - name: Check Xray and Flask in the image
        run: |
          docker run --rm --entrypoint /usr/local/bin/xray ruslan-xray-test version
          docker run --rm --entrypoint python3 ruslan-xray-test -c 'import server; assert server.app.test_client().get("/", environ_overrides={"REMOTE_ADDR": "172.30.32.2"}).status_code == 200'
