<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RuslanXRAY Gateway</title>
  <link rel="stylesheet" href="panel.css">
  <script src="panel.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="top">
      <a class="back" href="/" target="_top">← Home Assistant</a>
      <button id="network-open" class="quiet" disabled>Настройки сети</button>
    </header>
    <main>
      <section class="gateway" aria-labelledby="title">
        <div class="gateway-copy">
          <h1 id="title">RuslanXRAY</h1>
          <p id="status" class="status" role="status">Подключение к панели…</p>
          <p id="connection-info" class="muted"></p>
          <p id="gateway-error" class="error" role="alert" hidden></p>
        </div>
        <button id="power" class="power" disabled>
          <span class="power-symbol" aria-hidden="true">⏻</span>
          <span id="power-label">Включить шлюз</span>
        </button>
      </section>

      <section class="profiles" aria-labelledby="profiles-title">
        <div class="section-title">
          <h2 id="profiles-title">Профили</h2>
          <div class="buttons">
            <button id="catalog-refresh" class="quiet" hidden>Обновить</button>
            <button id="import-open" class="quiet" disabled>Добавить</button>
          </div>
        </div>
        <div id="profiles"></div>
        <p class="muted" id="profile-hint"></p>
      </section>
    </main>
    <footer>
      <div><strong>RuslanXRAY</strong><small>VPN-сервис автора</small></div>
      <a href="https://t.me/openinetkras_v2_bot" target="_blank" rel="noopener noreferrer">Открыть бота ↗</a>
    </footer>
    <div id="notice" class="notice" role="status" hidden></div>
  </div>

  <dialog id="network-dialog" aria-labelledby="network-title">
    <form id="network-form">
      <header class="dialog-title">
        <h2 id="network-title">Настройки сети</h2>
        <button type="button" class="quiet" data-close>Закрыть</button>
      </header>
      <label>Режим раздачи
        <select name="client_service">
          <option value="dhcp">Ethernet с DHCP</option>
          <option value="wifi_ap">Точка доступа Wi-Fi</option>
          <option value="manual">Ручная настройка IP</option>
        </select>
      </label>
      <label>Интерфейс для клиентов<select name="downstream" required></select></label>
      <div class="fields">
        <label>Адрес шлюза<input name="gateway_cidr" placeholder="192.168.50.1/24" required></label>
        <div id="dhcp-fields" class="fields">
          <label>Начало пула DHCP<input name="dhcp_start" placeholder="192.168.50.100"></label>
          <label>Конец пула DHCP<input name="dhcp_end" placeholder="192.168.50.200"></label>
        </div>
      </div>
      <p id="mode-hint" class="muted"></p>
      <div id="wifi-fields" class="fields" hidden>
        <label>Имя сети<input name="wifi_ssid"></label>
        <label>Пароль Wi-Fi<input name="wifi_password" type="password" autocomplete="new-password"></label>
        <label>Диапазон
          <select name="wifi_band"><option value="2.4">2,4 ГГц</option><option value="5">5 ГГц</option></select>
        </label>
        <label>Канал<select name="wifi_channel"></select></label>
        <p id="channel-hint" class="muted"></p>
      </div>
      <details>
        <summary>Дополнительные настройки</summary>
        <label class="check"><input name="lan_access" type="checkbox">Разрешить доступ между локальными подсетями</label>
        <p id="lan-route-hint" class="muted" hidden></p>
        <div class="fields">
          <label>Интернет (WAN)<select name="upstream" required></select></label>
          <label>Порт TProxy<input name="port" type="number" min="1024" max="65535" required></label>
          <label>Маршрутизация
            <select name="route_mode">
              <option value="force">Через VPN-выход</option>
              <option value="native">По правилам профиля</option>
            </select>
          </label>
          <label>Выход Xray<input name="target" placeholder="Автоматически"></label>
        </div>
        <div id="wifi-advanced" hidden>
          <label>Код страны Wi-Fi<input name="wifi_country" maxlength="2" placeholder="Например, RU"></label>
          <label class="check"><input name="wifi_apply_regdomain" type="checkbox">Применять регион ко всему Wi-Fi хоста</label>
          <label class="check"><input name="wifi_allow_dfs" type="checkbox">Разрешить DFS (запуск может занять дольше)</label>
          <label class="check"><input name="wifi_11n" type="checkbox">Включить 802.11n</label>
        </div>
      </details>
      <p class="error" role="alert" data-error hidden></p>
      <button type="submit" class="primary">Сохранить сеть</button>
    </form>
  </dialog>

  <dialog id="import-dialog" aria-labelledby="import-title">
    <div class="dialog-title">
      <h2 id="import-title">Добавить профиль</h2>
      <button type="button" class="quiet" data-close>Закрыть</button>
    </div>
    <form id="subscription-form">
      <label>URL подписки <input name="url" type="password" autocomplete="off" placeholder="https://…"></label>
      <label class="check"><input name="remnawave" type="checkbox" checked>Remnawave · добавить /json к ссылке</label>
      <details><summary>Настройки подписки</summary><label>User-Agent<input name="user_agent" required></label></details>
      <p class="error" role="alert" data-error hidden></p>
      <button type="submit" class="primary">Загрузить профили</button>
    </form>
    <details class="manual-import">
      <summary>Импортировать Xray JSON</summary>
      <form id="profile-form">
        <label>Файл JSON<input id="profile-file" type="file" accept=".json,application/json"></label>
        <label>Или вставьте JSON<textarea name="profile" rows="5" spellcheck="false"></textarea></label>
        <p class="error" role="alert" data-error hidden></p>
        <button type="submit" class="primary">Сохранить профиль</button>
      </form>
    </details>
  </dialog>
</body>
</html>
